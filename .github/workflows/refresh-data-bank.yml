name: Refresh NHS data bank

# Single job, five sources: CVDPREVENT, Fingertips, CQC, NHS England RTT/FFT,
# IMD. All confirmed reachable from GitHub's own cloud runners.
#
# OpenPrescribing and NHS Digital (National Diabetes Audit) are deliberately
# NOT in this workflow. Both reject requests from datacenter IP ranges
# (Cloudflare bot-challenge). These two are fetched manually instead --
# see MANUAL-FETCH-GUIDE.md for the exact steps.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch CVDPREVENT
        run: python3 scripts/fetch_cvdprevent.py

      - name: Fetch Fingertips
        run: python3 scripts/fetch_fingertips.py

      - name: Fetch CQC
        run: python3 scripts/fetch_cqc.py

      - name: Fetch NHS England bulk (RTT, FFT)
        run: python3 scripts/fetch_nhs_england_bulk.py

      - name: Fetch IMD
        run: python3 scripts/fetch_imd.py

      - name: Update manifest
        run: python3 scripts/update_manifest.py

      - name: Commit and push if data changed
        run: |
          git config user.name "data-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Automated data refresh $(date -u +%Y-%m-%d)"
          git push
