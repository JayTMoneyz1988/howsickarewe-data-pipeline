name: Fetch blocked NHS data sources

# OpenPrescribing and NHS Digital both reject requests from this Claude
# environment with a Cloudflare bot-challenge (confirmed Sept 2026 -- not a
# sandbox permission setting, their own bot protection). GitHub Actions'
# runners are ordinary cloud IPs that pass the same challenge fine, which is
# why this lives here rather than in the main pipeline.
#
# What this does: runs on a schedule, downloads fresh data, commits it to
# this repo. Claude then reads the repo directly (via the repo's raw file
# URLs, or by James pointing Claude at a fresh clone) -- no manual re-upload
# to any chat, ever, after this is set up once.
#
# Setup (one-off, on James's side):
#   1. Create a GitHub repo (private is fine) for this data.
#   2. Copy this whole github_action_blocked_sources/ folder's contents into
#      it, keeping the .github/workflows/ path.
#   3. Push. The workflow runs on the schedule below and on manual trigger.
#   4. Give Claude the repo's URL once -- Claude can then web_fetch raw file
#      URLs directly (github.com/<user>/<repo>/raw/main/data/...) each session.

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC -- CVDPREVENT/OpenPrescribing update roughly monthly, no need for daily runs
  workflow_dispatch: {}    # lets James trigger a run manually from the GitHub UI, no waiting for the schedule

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch OpenPrescribing
        run: python3 scripts/fetch_openprescribing.py

      - name: Fetch NHS Digital publications
        run: python3 scripts/fetch_nhs_digital.py

      - name: Commit and push if data changed
        run: |
          git config user.name "data-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Automated data refresh $(date -u +%Y-%m-%d)"
          git push
